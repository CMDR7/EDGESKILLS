<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EDGE-INSTA-STUDIO</title></head>
<body>
<script>
"use strict";
function clean(v,f){return typeof v==="string"&&v.trim()?v.trim():f;}
function makePackage(i){
 const topic=clean(i.topic,"Untitled topic"), type=clean(i.contentType,"package").toLowerCase();
 const tone=clean(i.tone,"clear, intelligent, engaging"), audience=clean(i.audience,"general social audience");
 const source=clean(i.sourceText,"");
 const base={topic,contentType:type,tone,audience,sourceProvided:Boolean(source),
 hookPrompt:"Create a concise curiosity-driven opening without clickbait.",
 captionStructure:["Hook","Context or value","Key takeaway","Call to action"],
 hashtagGuidance:"Use a small, relevant set. Avoid generic hashtag stuffing.",
 visualBrief:"Mobile-first visual concept with one dominant subject, strong hierarchy, readable text and safe margins."};
 if(type==="post")return base;
 if(type==="carousel")return {...base,carousel:["Slide 1: Cover hook","Slide 2: Context","Slide 3: Key insight","Slide 4: Evidence/example","Slide 5: Practical implication","Slide 6: Takeaway + CTA"]};
 if(type==="reel")return {...base,reel:{hook:"First 3 seconds: strongest curiosity gap.",scenes:"Short visual sequence.",voiceover:"Concise narration.",onscreenText:"Short readable text beats.",cta:"One clear action."}};
 if(type==="story")return {...base,story:["Frame 1: Hook","Frame 2: Context","Frame 3: Insight","Frame 4: Interactive element","Frame 5: CTA"]};
 return {...base,carousel:["Slide 1: Cover hook","Slide 2: Context","Slide 3: Key insight","Slide 4: Evidence/example","Slide 5: Implication","Slide 6: Takeaway + CTA"],reel:{hook:"First 3 seconds: strongest curiosity gap.",scenes:"Short visual sequence.",voiceover:"Concise narration.",onscreenText:"Short readable text beats.",cta:"One clear action."},story:["Frame 1: Hook","Frame 2: Context","Frame 3: Insight","Frame 4: Poll/question","Frame 5: CTA"]};
}
window["ai_edge_gallery_get_result"]=async function(data){
 try{return JSON.stringify({result:makePackage(JSON.parse(data||"{}"))});}
 catch(e){return JSON.stringify({error:"EDGE-INSTA-STUDIO failed: "+e.message});}
};
</script>
</body>
</html>
