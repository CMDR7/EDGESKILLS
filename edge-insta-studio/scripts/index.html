<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EDGE-INSTA-STUDIO V2</title></head>
<body>
<script>
"use strict";

function clean(v, fallback) {
  return typeof v === "string" && v.trim() ? v.trim() : fallback;
}

function normalizeType(v) {
  const t = clean(v, "").toLowerCase();
  if (t === "post" || t === "carousel" || t === "reel" || t === "story" || t === "package") return t;
  return "post";
}

function normalizeDepth(v) {
  const d = clean(v, "").toLowerCase();
  if (d === "brief" || d === "standard" || d === "detailed") return d;
  return "standard";
}

function makeResult(i) {
  const topic = clean(i.topic, "Source material");
  const type = normalizeType(i.contentType);
  const tone = clean(i.tone, "clear, intelligent, natural");
  const audience = clean(i.audience, "general social audience");
  const depth = normalizeDepth(i.summaryDepth);
  const source = clean(i.sourceText, "");

  const base = {
    topic,
    contentType: type,
    tone,
    audience,
    summaryDepth: depth,
    sourceProvided: Boolean(source),
    sourceLocked: true,
    externalResearch: false,
    instructions: {
      summarizeOnly: true,
      preserveMeaning: true,
      preserveAttribution: true,
      preserveUncertainty: true,
      noUnsupportedClaims: true,
      noExternalFacts: true,
      noWebDependency: true,
      humanLanguage: true,
      beginnerFriendly: true,
      proofreadBeforeReturn: true,
      correctGrammarBeforeReturn: true,
      removeDuplicatesBeforeReturn: true,
      completeAllFieldsBeforeReturn: true
    }
  };

  if (!source) {
    return {...base, error:"No sourceText was supplied. Provide source material to summarize."};
  }

  if (type === "post") return {
    ...base,
    requiredOutput:["HOOK","CAPTION","CTA","HASHTAGS","VISUAL BRIEF"],
    outputRule:"Return POST only. Summarize and adapt the supplied source. Do not add external facts."
  };

  if (type === "carousel") return {
    ...base,
    requiredOutput:["SLIDE STRUCTURE","CTA","HASHTAGS","VISUAL BRIEF"],
    outputRule:"Return CAROUSEL only. Extract and sequence the source's key information. Do not add external facts."
  };

  if (type === "reel") return {
    ...base,
    requiredOutput:["HOOK","SCENE SEQUENCE","VOICEOVER","ON-SCREEN TEXT","CTA","HASHTAGS","VISUAL BRIEF"],
    outputRule:"Return REEL only. Convert the supplied source into concise spoken narration and visuals without inventing information."
  };

  if (type === "story") return {
    ...base,
    requiredOutput:["FRAME SEQUENCE","INTERACTIVE ELEMENT","CTA OR CLOSING","HASHTAGS","VISUAL BRIEF"],
    outputRule:"Return STORY only. Divide the supplied source into concise frames without adding unsupported information."
  };

  return {
    ...base,
    requiredOutput:["POST","CAROUSEL","REEL","STORY"],
    outputRule:"Return the complete PACKAGE only when explicitly requested. All formats must derive from the same supplied source."
  };
}

window["ai_edge_gallery_get_result"] = async function(data) {
  try {
    const input = JSON.parse(data || "{}");
    return JSON.stringify({result:makeResult(input)});
  } catch (e) {
    return JSON.stringify({error:"EDGE-INSTA-STUDIO V2 failed: " + e.message});
  }
};
</script>
</body>
</html>
